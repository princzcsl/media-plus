<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>Media+</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="brand">
        <img src="../icons/48.png" alt="" width="30" height="30">
        <span class="brand-name">Media+</span>
      </div>
      <button class="live" id="audio-live" data-go="mixer" hidden>
        <span class="live-dot"></span><span data-i18n="mixerActive"></span>
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="media" data-icon="video"><span data-i18n="tabMedia"></span></button>
      <button class="tab" role="tab" data-view="mixer" data-icon="sliders"><span data-i18n="tabMixer"></span></button>
      <button class="tab" role="tab" data-view="settings" data-icon="settings"><span data-i18n="tabSettings"></span></button>
    </nav>

    <main class="body">
      <!-- Media -->
      <section class="view" id="view-media" role="tabpanel">
        <div id="jobs" class="jobs" hidden></div>
        <div id="media-list" class="media-list"></div>
        <div id="others" hidden>
          <div class="section-head">
            <h2 class="section-title" data-i18n="otherTabs"></h2>
            <button class="link-btn" id="mute-others" data-i18n="muteOthers"></button>
          </div>
          <div id="other-list" class="other-list"></div>
        </div>
      </section>

      <!-- Mixer -->
      <section class="view" id="view-mixer" role="tabpanel" hidden>
        <div class="card boost-card">
          <div class="row space">
            <div>
              <div class="label" data-i18n="boost"></div>
              <div class="muted small" id="boost-help"></div>
            </div>
            <div class="boost-value"><span id="boost-value">100</span><small>%</small></div>
          </div>
          <input type="range" class="range" id="boost" min="0" max="600" step="5" value="100" data-i18n-title="boost">
          <div class="chips" id="boost-quick"></div>
        </div>

        <div class="section-head">
          <h2 class="section-title" data-i18n="presets"></h2>
          <button class="link-btn" id="preset-save" data-i18n="presetSave"></button>
        </div>
        <form class="row preset-form" id="preset-form" hidden>
          <input class="input" id="preset-name" maxlength="24" data-i18n-placeholder="presetName" required>
          <button class="button primary" type="submit" data-i18n="save"></button>
          <button class="button" type="button" id="preset-cancel" data-i18n="cancel"></button>
        </form>
        <div class="chips" id="presets"></div>

        <div class="section-head">
          <h2 class="section-title" data-i18n="equalizer"></h2>
          <button class="link-btn" id="eq-reset" data-i18n="reset"></button>
        </div>
        <div class="card eq-card">
          <canvas id="eq-curve" class="eq-curve"></canvas>
          <div class="eq-bands" id="eq-bands"></div>
        </div>

        <h2 class="section-title" data-i18n="effects"></h2>
        <div class="list">
          <div class="item">
            <span><span class="label" data-i18n="enhancer"></span><span class="muted small" data-i18n="enhancerHelp"></span></span>
            <div class="effect-slider">
              <span class="small effect-value" id="enhancer-value"></span>
              <input type="range" class="range" id="enhancer" min="0" max="100" step="5" value="0" data-i18n-title="enhancer">
            </div>
          </div>
          <label class="item">
            <span><span class="label" data-i18n="normalize"></span><span class="muted small" data-i18n="normalizeHelp"></span></span>
            <span class="switch"><input type="checkbox" id="normalize"><span></span></span>
          </label>
          <div class="item stacked">
            <span><span class="label" data-i18n="vocal"></span><span class="muted small" data-i18n="vocalHelp"></span></span>
            <div class="segmented" id="vocal" role="radiogroup">
              <button data-vocal="off" data-i18n="vocalOff"></button>
              <button data-vocal="remove" data-i18n="vocalRemove"></button>
              <button data-vocal="isolate" data-i18n="vocalIsolate"></button>
            </div>
          </div>
          <div class="item">
            <span><span class="label" data-i18n="pitch"></span><span class="muted small" data-i18n="pitchHelp"></span></span>
            <div class="effect-slider">
              <span class="small effect-value" id="pitch-value"></span>
              <input type="range" class="range" id="pitch" min="-12" max="12" step="1" value="0" data-i18n-title="pitch">
            </div>
          </div>
        </div>

        <h2 class="section-title" data-i18n="output"></h2>
        <div class="list">
          <label class="item">
            <span><span class="label" data-i18n="limiter"></span><span class="muted small" data-i18n="limiterHelp"></span></span>
            <span class="switch"><input type="checkbox" id="limiter"><span></span></span>
          </label>
          <label class="item">
            <span><span class="label" data-i18n="night"></span><span class="muted small" data-i18n="nightHelp"></span></span>
            <span class="switch"><input type="checkbox" id="night"><span></span></span>
          </label>
          <label class="item">
            <span><span class="label" data-i18n="mono"></span><span class="muted small" data-i18n="monoHelp"></span></span>
            <span class="switch"><input type="checkbox" id="mono"><span></span></span>
          </label>
          <div class="item">
            <span><span class="label" data-i18n="balance"></span><span class="muted small balance-value" id="balance-value"></span></span>
            <div class="balance">
              <span class="muted small" data-i18n="left"></span>
              <input type="range" class="range" id="balance" min="-100" max="100" step="1" value="0" data-i18n-title="balance">
              <span class="muted small" data-i18n="right"></span>
            </div>
          </div>
        </div>

        <div class="mixer-foot">
          <p class="muted small" data-i18n="mixerNote"></p>
          <button class="button" id="mixer-off" data-i18n="mixerOff" hidden></button>
        </div>
      </section>

      <!-- Settings -->
      <section class="view" id="view-settings" role="tabpanel" hidden>
        <h2 class="section-title" data-i18n="downloads"></h2>
        <div class="list">
          <div class="item">
            <span><span class="label" data-i18n="location"></span><span class="muted small" data-i18n="locationHelp"></span></span>
            <select class="select" data-setting="saveAs" data-type="bool">
              <option value="true" data-i18n="locationAsk"></option>
              <option value="false" data-i18n="locationDirect"></option>
            </select>
          </div>
          <div class="item" id="subfolder-row">
            <span><span class="label" data-i18n="subfolder"></span><span class="muted small" data-i18n="subfolderHelp"></span></span>
            <input class="input narrow" data-setting="subfolder" maxlength="60" placeholder="Media+">
          </div>
          <div class="item">
            <span class="label" data-i18n="naming"></span>
            <select class="select" data-setting="naming">
              <option value="title" data-i18n="namingTitle"></option>
              <option value="site-date" data-i18n="namingSite"></option>
            </select>
          </div>
        </div>

        <h2 class="section-title">yt-dlp</h2>
        <div class="list">
          <div class="item">
            <span><span class="label" data-i18n="companion"></span><span class="muted small" id="host-status"></span></span>
            <button class="button" id="host-action"></button>
          </div>
          <div class="item">
            <span><span class="label" data-i18n="engine"></span><span class="muted small" data-i18n="engineHelp"></span></span>
            <select class="select" data-setting="engine">
              <option value="auto" data-i18n="engineAuto"></option>
              <option value="browser" data-i18n="engineBrowser"></option>
            </select>
          </div>
          <div class="item">
            <span><span class="label" data-i18n="quality"></span><span class="muted small" data-i18n="qualityHelp"></span></span>
            <select class="select" data-setting="quality">
              <option value="best" data-i18n="qualityBest"></option>
              <option value="compat" data-i18n="qualityCompat"></option>
            </select>
          </div>
          <div class="item">
            <span class="label" data-i18n="maxHeight"></span>
            <select class="select" data-setting="maxHeight" data-type="number">
              <option value="0" data-i18n="maxHeightBest"></option>
              <option value="2160">2160p (4K)</option>
              <option value="1440">1440p</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
            </select>
          </div>
          <label class="item">
            <span><span class="label" data-i18n="sendCookies"></span><span class="muted small" data-i18n="sendCookiesHelp"></span></span>
            <span class="switch"><input type="checkbox" data-setting="sendCookies"><span></span></span>
          </label>
        </div>

        <h2 class="section-title" data-i18n="screenshots"></h2>
        <div class="list">
          <div class="item">
            <span class="label" data-i18n="format"></span>
            <select class="select" data-setting="shotFormat">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="item">
            <span class="label" data-i18n="afterShot"></span>
            <select class="select" data-setting="shotAction">
              <option value="download" data-i18n="shotDownload"></option>
              <option value="copy" data-i18n="shotCopy"></option>
              <option value="both" data-i18n="shotBoth"></option>
            </select>
          </div>
        </div>

        <h2 class="section-title" data-i18n="playback"></h2>
        <div class="list">
          <div class="item">
            <span><span class="label" data-i18n="defaultSpeed"></span><span class="muted small" data-i18n="defaultSpeedHelp"></span></span>
            <select class="select" data-setting="defaultSpeed" data-type="number" id="default-speed"></select>
          </div>
          <label class="item">
            <span><span class="label" data-i18n="preservePitch"></span><span class="muted small" data-i18n="preservePitchHelp"></span></span>
            <span class="switch"><input type="checkbox" data-setting="preservePitch"><span></span></span>
          </label>
        </div>

        <h2 class="section-title" data-i18n="tabMixer"></h2>
        <div class="list">
          <div class="item">
            <span><span class="label" data-i18n="rememberMixer"></span><span class="muted small" data-i18n="rememberMixerHelp"></span></span>
            <select class="select" data-setting="rememberMixer">
              <option value="site" data-i18n="rememberSite"></option>
              <option value="global" data-i18n="rememberGlobal"></option>
              <option value="off" data-i18n="rememberOff"></option>
            </select>
          </div>
          <div class="item">
            <span class="label" data-i18n="maxBoost"></span>
            <select class="select" data-setting="maxBoost" data-type="number">
              <option value="200">200 %</option>
              <option value="300">300 %</option>
              <option value="400">400 %</option>
              <option value="600">600 %</option>
            </select>
          </div>
        </div>

        <h2 class="section-title" data-i18n="interface"></h2>
        <div class="list">
          <div class="item">
            <span class="label" data-i18n="theme"></span>
            <select class="select" data-setting="theme">
              <option value="auto" data-i18n="themeAuto"></option>
              <option value="dark" data-i18n="themeDark"></option>
              <option value="light" data-i18n="themeLight"></option>
            </select>
          </div>
          <div class="item">
            <span><span class="label" data-i18n="shortcuts"></span><span class="muted small" id="shortcut-list"></span></span>
            <button class="button" id="open-shortcuts" data-i18n="configure"></button>
          </div>
        </div>

        <div class="settings-foot">
          <button class="button" id="reset-settings" data-i18n="resetSettings"></button>
          <div class="muted small" id="version"></div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
